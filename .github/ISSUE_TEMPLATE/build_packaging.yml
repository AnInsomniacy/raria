name: Build or Packaging Issue
description: Report a build, CI, release archive, or checksum problem
title: "[build]: "
labels: ["build"]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v1.0.0 or 0123456789abcdef"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and Rust version
      placeholder: "Ubuntu 24.04 x86_64, rustc 1.85.0"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or workflow step
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Failure output
      description: Include the relevant compiler, linker, packaging, archive, or checksum output.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: validations
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first.
          required: true
        - label: I included the exact command or workflow step that failed.
          required: true
