name: Feature Request
description: Propose a raria-native capability or integration improvement
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        raria does not accept compatibility requests for JSON-RPC, aria2 method names, old option names, old session formats, AriaNg, or legacy Motrix adapters.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow or integration gap.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed native behavior
      description: Describe the desired CLI, config, API, event, persistence, protocol, or release behavior.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Public contract impact
      description: List any new route, event field, CLI flag, config key, schema field, or documented behavior. Write "none" if there is no public contract change.
    validations:
      required: true

  - type: checkboxes
    id: validations
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first.
          required: true
        - label: This request keeps raria-native public surfaces.
          required: true
