name: Bug Report
description: Report a reproducible raria bug, crash, hang, or regression
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report reproducible defects only. Use raria-native terms: CLI, `raria.toml`, `/api/v1`, `/api/v1/events`, and `taskId`.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output from `raria --version`, or the Git commit if built from source.
      placeholder: "raria 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Daemon
        - Native API
        - WebSocket events
        - Configuration
        - Persistence or restore
        - HTTP or HTTPS
        - FTP or FTPS
        - SFTP
        - BitTorrent or magnet
        - Metalink
        - Release archive
        - Documentation
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS arm64 15.5, Ubuntu 24.04 x86_64, Windows 11 x86_64"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the shortest command, config, API request, event sequence, or transfer input that reproduces the issue. Redact secrets.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behavior
      description: Include native error codes, lifecycle states, or crash output when relevant.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add concise logs, backtrace, API response, event message, checksum, or focused test output. Redact secrets.
      render: text

  - type: checkboxes
    id: validations
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first.
          required: true
        - label: I did not include bearer tokens, passwords, cookies, private keys, or private downloaded content.
          required: true
