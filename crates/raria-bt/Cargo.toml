[package]
name = "raria-bt"
description = "BitTorrent download service for raria using librqbit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
raria-core = { workspace = true }
raria-range = { workspace = true }
raria-http = { workspace = true }
raria-ftp = { workspace = true }
raria-sftp = { workspace = true }
librqbit = { workspace = true, features = ["rust-tls", "http-api-client"] }
librqbit-bencode = { workspace = true, features = ["sha1-ring"] }
librqbit-dht = { workspace = true, features = ["sha1-ring"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
url = { workspace = true }
sha1_smol = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }
tokio-util = { workspace = true }
serial_test = { workspace = true }
wiremock = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
