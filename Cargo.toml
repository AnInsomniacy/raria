[workspace]
members = [
    "crates/raria-core",
    "crates/raria-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/raria"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bendy = "0.6.1"
bytes = "1.11.1"
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
futures-util = "0.3.32"
governor = "0.10.4"
libunftp = { version = "0.23.0", default-features = false, features = ["ring"] }
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls"] }
netrc = "0.4.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rand = "0.10.1"
quick-xml = "0.37.5"
russh = { version = "0.61.2", default-features = false, features = ["ring"] }
russh-sftp = "2.3.0"
suppaftp = { version = "8.0.3", features = ["tokio"] }
tempfile = "3.24.0"
unftp-sbe-fs = "0.4.0"
url = "2.5.8"
