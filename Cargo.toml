[workspace]
resolver = "2"
members = [
    "crates/raria-core",
    "crates/raria-range",
    "crates/raria-http",
    "crates/raria-ftp",
    "crates/raria-sftp",
    "crates/raria-metalink",
    "crates/raria-bt",
    "crates/raria-rpc",
    "crates/raria-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AnInsomniacy/raria"
authors = ["AnInsomniacy <https://github.com/AnInsomniacy>"]
rust-version = "1.85"
readme = "README.md"
keywords = ["download", "daemon", "bittorrent", "metalink"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
# === Async Runtime ===
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
pin-project-lite = "0.2"
async-trait = "0.1"

# === HTTP ===
reqwest = { version = "0.12", default-features = false, features = [
    "stream", "gzip", "brotli", "cookies", "socks", "rustls-tls"
] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"

# === FTP / SFTP ===
suppaftp = { version = "8", features = ["tokio-rustls-ring"] }
russh = "0.51"
russh-sftp = "2"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
async-stream = "0.3"
home = "0.5"

# === BitTorrent ===
librqbit = { version = "8.1.1", default-features = false }
librqbit-bencode = { version = "3", default-features = false }
librqbit-dht = { version = "5", default-features = false }
sha1_smol = "1"

# === Native API ===
axum = { version = "0.7", features = ["ws"] }

# === Rate Limiting ===
governor = "0.8"
arc-swap = "1"

# === Synchronization ===
parking_lot = "0.12"

# === Persistence ===
redb = "2"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# === XML / Metalink ===
quick-xml = { version = "0.37", features = ["serialize"] }

# === CLI ===
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# === Logging ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# === Utilities ===
url = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
console = "0.15"
bytes = "1"
rand = "0.9"
hex = "0.4"
base64 = "0.22"
tokio-tungstenite = "0.24"
tokio-socks = "0.5"
netrc = { package = "rust-netrc", version = "0.1.2" }
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"

# === Workspace Crates ===
raria-core = { path = "crates/raria-core" }
raria-range = { path = "crates/raria-range" }
raria-http = { path = "crates/raria-http" }
raria-ftp = { path = "crates/raria-ftp" }
raria-sftp = { path = "crates/raria-sftp" }
raria-metalink = { path = "crates/raria-metalink" }
raria-bt = { path = "crates/raria-bt" }
raria-rpc = { path = "crates/raria-rpc" }

# === Test Dependencies ===
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"
digest_auth = "0.3.1"
serial_test = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
